name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The exact patch go.mod declares: golangci-lint v2.13.2 cannot read
          # export data from a newer 1.27 patch (as in aeman's CI).
          go-version: "1.27.1"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  build:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build & test frontend
        working-directory: web
        run: |
          npm ci
          npm run build
          npm test
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
      - name: Build binary
        run: make backend
      # -race: HTTP handlers, the ygo rooms, the flusher and the git sync all
      # touch the board store concurrently. The git tests use file:// remotes,
      # which need the git binary the runner has.
      - name: Test
        run: AENOTES_TEST_REQUIRE_GIT=1 go test -race ./...
